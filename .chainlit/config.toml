[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = true
# Browser origins allowed to embed or call the UI. Narrow this for a
# deployment; "*" is a local-development convenience.
allow_origins = ["*"]

[features]
# Model output is rendered as Markdown, never as raw HTML. The share page
# sanitises separately with DOMPurify.
unsafe_allow_html = false
latex = false
user_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false

[features.spontaneous_file_upload]
enabled = false

[features.audio]
enabled = false

[features.mcp]
enabled = false

[UI]
name = "Knowledge Assistant"
description = "Ask questions about your indexed documentation."
input_placeholder = "Ask a question about the indexed documentation…"
layout = "wide"
cot = "hidden"
alert_style = "classic"

[meta]
generated_by = "2.9.0"
